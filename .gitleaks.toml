[extend]
useDefault = true

[[allowlists]]
description = """
Cryptographic primitive and algorithm NAMES are flagged by gitleaks' generic-api-key rule purely \
on entropy -- 'XChaCha20-Poly1305' scores 3.73 and looks like a key to the heuristic. This is a \
cryptography repo, so these names appear throughout the docs, tool descriptions and code comments \
and will keep tripping the gate forever otherwise.

Deliberately NOT scoped with `paths`: gitleaks defaults a paths+regexes allowlist to OR, so naming \
a file there exempts the ENTIRE FILE and a real credential added beside one of these names would \
sail through. (That exact mistake was found and fixed in reconlion-operator's config on 2026-09-10 \
after a planted live-format token passed the gate silently.) These regexes match only the literal \
algorithm names, so any actual secret -- in any file, including these -- still trips the gate.

regexTarget = "line" is required because allowlist regexes match the captured secret rather than \
the source line by default.

Verified 2026-10-01 by planting a live-format GitHub token in a file containing these names and \
confirming the gate still blocked.
"""
regexTarget = "line"
regexes = [
  '''XChaCha20-Poly1305''',
  '''ChaCha20-Poly1305''',
  '''HKDF-SHA256''',
  '''HKDF-SHA-256''',
  '''Ed25519''',
  '''X25519''',
  '''argon2id''',
]

[[allowlists]]
description = """
Known-worthless passwords, present as fixtures because the tool must REJECT them. \
`sealed.js` carries a list of the passwords people actually pick so it can refuse them, and \
`test/sealed.test.js` asserts each one is refused. gitleaks' generic-api-key rule fires on \
`qwertyuiop123` on entropy alone.

These strings are the opposite of secrets: every one is in every cracking dictionary in \
existence, which is precisely why they are hard-coded here. Allowlisting them costs nothing — if \
one were ever someone's real credential it would already be worthless.

Deliberately NOT scoped with `paths`: gitleaks defaults a paths+regexes allowlist to OR, so \
naming a file there exempts the ENTIRE FILE, and a real credential added beside these would sail \
through. (That mistake was found and fixed in reconlion-operator's config on 2026-09-10 after a \
planted live-format token passed the gate.) Each entry below matches only its own literal string, \
so anything else in any file still trips the gate — re-verified 2026-10-01 by planting a \
live-format GitHub token in this repo and confirming it was blocked.
"""
regexTarget = "line"
regexes = [
  '''qwertyuiop123''',
  '''p@ssw0rd''',
  '''password123''',
  '''PASSWORD123''',
  '''Password-123''',
  '''1q2w3e4r''',
  '''trustno1''',
  '''correcthorsebatterystaple''',
  '''Tr0ub4dor''',
]
